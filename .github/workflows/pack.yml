name: Build .ehpk

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}" > .env
      - run: echo "VITE_GOOGLE_CLIENT_SECRET=${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}" >> .env
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: g2-gmail-ehpk-${{ github.sha }}
          path: g2-gmail.ehpk
          if-no-files-found: error
